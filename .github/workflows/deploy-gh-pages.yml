name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main
  # every morning: refresh the AI benchmark data and republish
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  deploy:
    # repo default token is read-only; publishing pushes to gh-pages
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      # public sources for /benchmark; a failed source keeps the committed copy
      - name: Refresh AI benchmark data
        run: node scripts/ai-bench/fetch.mjs
        continue-on-error: true
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}

      - name: Build React app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
