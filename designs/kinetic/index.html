<!DOCTYPE html>
<!--
  "Yuffie - Kinetic Interface v4" by velkaa — https://codepen.io/velkaa/pen/GgNNwrB
  Background, character render and audio track are hotlinked from the original pen.
  Only change for this site: the mobile layout at the end of the <style> block, and preview.js.
-->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuffie - Kinetic Interface v4</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060608;
            background-image: radial-gradient(circle at center, #2b0404 0%, #060608 100%);
            font-family: 'Noto Sans JP', 'Syncopate', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- CONTENEDOR CON BORDES DESVANECIDOS --- */
        .canvas-container {
            width: 95vw;
            height: 53.43vw;
            max-width: 1200px;
            max-height: 675px;
            display: grid;
            grid-template-columns: 45% 42% 13%;
            background-image: url('https://u.cubeupload.com/zmonochrome/tumblr8b1866a9355004.jpg');
            background-size: cover;
            background-position: center;
            position: relative;

            /* El secreto: múltiples capas de sombras y difuminado para romper el rectángulo rígido */
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.8),
                inset 0 0 80px rgba(6, 6, 8, 0.9),
                inset 0 0 140px rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px; /* Esquinas ligeramente más amables */
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Capa de desvanecido periférico extremo (Vignette) */
        .canvas-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(6, 6, 8, 0.85) 100%);
            z-index: 12; /* Por encima de casi todo para suavizar los bordes hacia adentro */
            pointer-events: none;
        }

        /* Rejilla sutil de puntos */
        .canvas-dot-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 15%, transparent 16%);
            background-size: 6px 6px;
            z-index: 2;
            pointer-events: none;
        }

        /* Brackets decorativos sutiles */
        .ui-corner-bracket {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            z-index: 13;
            pointer-events: none;
        }
        .top-left { top: 25px; left: 25px; border-right: none; border-bottom: none; }
        .bottom-right { bottom: 25px; right: 25px; border-left: none; border-top: none; }

        /* --- TEXTO DE FONDO ANIMADO (NIHILITY) --- */
        .nihility-bg-text {
            position: absolute;
            width: 200%;
            top: 45%;
            left: 0;
            transform: translateY(-50%);
            font-family: 'Syncopate', sans-serif;
            font-size: 14rem;
            font-weight: 700;
            color: rgba(181, 137, 61, 0.03);
            letter-spacing: 30px;
            white-space: nowrap;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            animation: move-nihility 35s linear infinite;
        }

        /* --- CANVAS PARA PÉTALOS FLUIDOS --- */
        #petals-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 11; /* Elevado para que floten elegantemente sobre los paneles laterales también */
            pointer-events: none;
            will-change: transform;
        }

        /* --- PANEL IZQUIERDO --- */
        .left-panel {
            padding: 5% 7%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 5;
            background: linear-gradient(90deg, rgba(6, 6, 8, 0.98) 0%, rgba(70, 3, 3, 0.65) 75%, rgba(0, 0, 0, 0) 100%);
        }

        .hero-quote-header {
            font-size: 0.75rem;
            font-weight: 900;
            color: #cbd5e1;
            letter-spacing: 2px;
            line-height: 1.5;
            text-transform: uppercase;
            border-left: 3px solid #b5893d;
            padding-left: 10px;
        }

        .quote-jp {
            font-size: 0.65rem;
            color: #8492a6;
            display: block;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .main-title-group {
            position: relative;
            margin-top: 15px;
        }

        .main-kanji {
            font-size: 9.5rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 0.85;
            letter-spacing: -6px;
            display: inline-block;
            text-shadow:
                1px 1px 0px #b5893d,
                2px 2px 0px #8a6428,
                3px 3px 0px #5e4319,
                5px 5px 25px rgba(0, 0, 0, 0.95);
        }

        .japanese-sub {
            font-size: 0.95rem;
            color: #f1f5f9;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 8px;
            display: block;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .numeric-badge {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 4px 16px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 2px;
        }

        /* --- REPRODUCTOR AUDIO --- */
        .music-player {
            background: rgba(10, 10, 14, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 6px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease;
        }

        .music-player.is-playing {
            border-color: rgba(181, 137, 61, 0.4);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 65%;
        }

        .time-display {
            font-size: 0.65rem;
            font-family: monospace;
            color: #94a3b8;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            position: relative;
            cursor: pointer;
            border-radius: 2px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b5893d, #ffffff);
            position: absolute;
            top: 0; left: 0;
            border-radius: 2px;
            box-shadow: 0 0 8px #b5893d;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .play-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 6px 20px;
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        .play-btn:hover {
            background: #ffffff;
            color: #060608;
            transform: scale(1.03);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-label {
            font-size: 0.55rem;
            color: #475569;
            font-family: monospace;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 8px;
            background: #b5893d;
            border-radius: 50%;
        }

        .left-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 15px;
        }

        .game-meta {
            font-size: 0.65rem;
            color: #475569;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .tag-pill {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            padding: 4px 14px;
            font-size: 0.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 2px;
        }

        /* --- PANEL CENTRAL --- */
        .center-panel {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        .art-window {
            width: 92%;
            height: 90%;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            background: linear-gradient(135deg, rgba(20, 30, 30, 0.05) 0%, rgba(10, 15, 15, 0.3) 100%);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Escaneo láser sutil */
        .art-window::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(181, 137, 61, 0.3), rgba(255,255,255,0.4), rgba(181, 137, 61, 0.3), transparent);
            top: 0; z-index: 2;
            animation: laser-scan 4s linear infinite;
        }

        .large-bg-kanji {
            font-size: 16rem;
            color: rgba(255, 255, 255, 0.02);
            position: absolute;
            top: -20px; left: -20px;
            font-weight: 900;
            z-index: 2;
            user-select: none;
        }

        .tech-overlay {
            position: absolute;
            right: 25px; top: 25%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.55rem;
            font-family: monospace;
            z-index: 3;
        }

        .live-pulse-bar {
            width: 40px;
            height: 2px;
            background-color: #b5893d;
            animation: bar-stretch 1.2s infinite ease-in-out;
        }

        /* --- EL RENDER DEL PERSONAJE (CON EFECTO SUAVE PARALLAX) --- */
        .character-root {
            position: absolute;
            width: 140%; height: 115%;
            bottom: 2%; left: -20%;
            z-index: 10;
            pointer-events: none;
            /* Suavizado de traslación */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .character-img {
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: bottom center;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 60px rgba(220, 38, 38, 0.12));
            animation: float-character 6s ease-in-out infinite;
        }

        /* --- PANEL DERECHO --- */
        .right-panel {
            background: transparent;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            position: relative;
            z-index: 15;
            background: linear-gradient(-90deg, rgba(6, 6, 8, 0.4) 0%, transparent 100%);
        }

        .pill-box {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px 18px;
            font-size: 0.65rem;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255,255,255,0.02);
        }

        .vertical-text-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .v-kanji-title {
            writing-mode: vertical-rl;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .v-latin-sub {
            writing-mode: vertical-rl;
            font-size: 0.7rem;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.5);
        }

        .diamond {
            color: #b5893d;
            font-size: 0.7rem;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .panel-footer-stamp {
            text-align: center;
        }

        .micro-japanese {
            font-size: 0.45rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            margin-top: 8px;
        }

        /* --- KEYFRAMES --- */
        @keyframes move-nihility {
            0% { transform: translate(0, -50%); }
            100% { transform: translate(-50%, -50%); }
        }

        @keyframes float-character {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes laser-scan {
            0% { top: 0%; opacity: 0; }
            5%, 95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes bar-stretch {
            0%, 100% { width: 15px; }
            50% { width: 45px; }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* --- Added for this site: below 760px the 16:9 card becomes a scrolling column --- */
        @media (max-width: 760px) {
            body { overflow-y: auto; align-items: flex-start; padding: 12px 0; }
            .canvas-container {
                width: calc(100vw - 24px);
                height: auto;
                max-height: none;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto 70vw auto;
            }
            .left-panel { min-width: 0; padding: 28px 20px 20px; gap: 20px; }
            .left-footer { gap: 12px; }
            .main-kanji { font-size: clamp(5rem, 28vw, 9.5rem); }
            .center-panel { order: 2; }
            .right-panel { order: 3; flex-direction: row; padding: 16px 24px; }
            .vertical-text-wrap { flex-direction: row; }
            .v-kanji-title, .v-latin-sub, .micro-japanese { writing-mode: horizontal-tb; transform: none; }
            .v-kanji-title { font-size: 1.6rem; white-space: nowrap; letter-spacing: 4px; }
            .nihility-bg-text { font-size: 7rem; }
        }
    </style>
</head>
<body>

    <div class="canvas-container" id="main-canvas">

        <div class="canvas-dot-overlay"></div>
        <div class="ui-corner-bracket top-left"></div>
        <div class="ui-corner-bracket bottom-right"></div>

        <div class="nihility-bg-text">NIHILITY NIHILITY NIHILITY</div>

        <!-- CANVAS PARA EL EFECTO DE FLORES DELICADAS -->

        <!-- PANEL IZQUIERDO -->
        <section class="left-panel">

            </div>

            <div class="main-title-group">
                <span class="japanese-sub">ブレイジング・ブライト</span>

                <br>
                <div class="numeric-badge">1542991141</div>

                <div class="music-player" id="player-card">
                    <audio id="audio-element" src="https://www.dropbox.com/scl/fi/ersb17v6uwmcelmvapgxp/Fall-To-Hell-DOLLWAVE-Darkwave-Lyrics-visualizer.mp3?rlkey=3pfivpdswvsnwxwzqnix01wnl&st=vs1tmdms&dl=1"></audio>

                        <button class="play-btn" id="play-trigger">Play</button>
                        <div class="volume-container">
                            <span class="volume-label">VOL</span>
                            <input type="range" class="volume-slider" id="vol-slider" min="0" max="1" step="0.05" value="0.5">
                        </div>

        <!-- PANEL CENTRAL -->
        <section class="center-panel">

                <span class="large-bg-kanji">古</span>

                    <span>STATUS: ACTIVE</span>
                    <span>GLASS: JINSHI_DARK</span>

            <!-- Elemento Raíz del Personaje asignado para Parallax Suave -->
            <div class="character-root" id="character-layer">
                <img src="https://u.cubeupload.com/zmonochrome/b00chisarenderwuthering.png" alt="Render" class="character-img">

        <!-- PANEL DERECHO -->
        <aside class="right-panel">

                <span class="diamond">✦</span>

            </div>
            <div class="panel-footer-stamp">
                <div style="color: rgba(255,255,255,0.2); font-size: 10px;">—</div>
                <p class="micro-japanese">システム起動完了</p>
            </div>
        </aside>

    </div>

    <script src="../preview.js"></script>
    <script>
        const mainCanvas = document.getElementById('main-canvas');
        const charLayer = document.getElementById('character-layer');
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-trigger');
        const playerCard = document.getElementById('player-card');
        const progressContainer = document.getElementById('progress-cont');
        const progressBar = document.getElementById('progress-actual');
        const timeDisplay = document.getElementById('time-track');
        const volumeSlider = document.getElementById('vol-slider');

        // --- PARALLAX DE CAPAS SUAVE E INERTE (ADIÓS CAJA ROTATIVA) ---
        let mouseX = 0, mouseY = 0;
        let charX = 0, charY = 0;
        let petalsParamX = 0;

        document.addEventListener('mousemove', (e) => {
            // Calculamos la posición normalizada del mouse (-1 a 1)
            mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        });

        function updateParallax() {
            // Interpolación matemática (Lerp) para dar inercia ultra suave al render
            const targetX = mouseX * 18;  // Rango máximo de movimiento horizontal (px)
            const targetY = mouseY * 12;  // Rango máximo de movimiento vertical (px)

            charX += (targetX - charX) * 0.08;
            charY += (targetY - charY) * 0.08;

            // Movemos sutilmente los pétalos en dirección opuesta
            petalsParamX += (-mouseX * 10 - petalsParamX) * 0.05;

            charLayer.style.transform = `translate(${charX}px, ${charY}px)`;

            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        // --- SISTEMA DE PÉTALOS DE FLORES DELICADAS ---
        const petalCanvas = document.getElementById('petals-canvas');
        const ctx = petalCanvas.getContext('2d');

        function resizeCanvas() {
            petalCanvas.width = mainCanvas.clientWidth;
            petalCanvas.height = mainCanvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        const petalsArray = [];
        const maxPetals = 30;

        class Petal {
            constructor() {
                this.x = Math.random() * petalCanvas.width;
                this.y = Math.random() * -petalCanvas.height;
                this.size = Math.random() * 5 + 3; // Ligeramente más pequeños y finos
                this.speedY = Math.random() * 0.7 + 0.3;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.8 - 0.4;

                const colors = [
                    'rgba(239, 68, 68, 0.25)',  // Rojo fuego sutil
                    'rgba(249, 115, 22, 0.20)', // Naranja etéreo
                    'rgba(254, 205, 211, 0.25)' // Pétalo rosa/blanco delicado
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speedY;
                // Sumamos la inercia del mouseParamX para arrastrar las flores con el aire del mouse
                this.x += this.speedX + Math.sin(this.y / 40) * 0.25 + (petalsParamX * 0.02);
                this.angle += this.spin;

                if (this.y > petalCanvas.height + 10) {
                    this.y = -10;
                    this.x = Math.random() * petalCanvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);
                ctx.fillStyle = this.color;

                ctx.beginPath();
                // Forma almendrada orgánica de flor
                ctx.ellipse(0, 0, this.size, this.size / 1.8, 0, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxPetals; i++) {
            petalsArray.push(new Petal());
        }

        function animatePetals() {
            ctx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);
            for (let i = 0; i < petalsArray.length; i++) {
                petalsArray[i].update();
                petalsArray[i].draw();
            }
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // --- LÓGICA DE AUDIO ---
        audio.volume = volumeSlider.value;

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = 'Pause';
                playerCard.classList.add('is-playing');
            } else {
                audio.pause();
                playBtn.textContent = 'Play';
                playerCard.classList.remove('is-playing');
            }
        });

        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        });

        audio.addEventListener('loadedmetadata', () => {
            timeDisplay.textContent = `0:00 / ${formatTime(audio.duration)}`;
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        audio.addEventListener('ended', () => {
            playBtn.textContent = 'Play';
            progressBar.style.width = '0%';
            playerCard.classList.remove('is-playing');
        });
    </script>
</body>
</html>
