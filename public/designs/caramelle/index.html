<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caramelle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sparkles" aria-hidden="true"></div>
    <main class="game">
      <div class="side">
        <h1 class="logo">Caramelle</h1>

        <ol class="map" id="map" aria-label="Livelli"></ol>

        <div class="hud">
          <div class="pill level">
            <span class="lbl">Livello</span>
            <b id="lvl">1</b>
          </div>
          <div class="pill score">
            <span class="lbl" id="lvl-name">Punti</span>
            <b id="score">0</b>
            <div class="bar" aria-hidden="true">
              <i id="fill"></i>
              <s></s><s></s><s></s>
            </div>
          </div>
          <div class="pill moves">
            <span class="lbl">Mosse</span>
            <b id="moves">25</b>
          </div>
        </div>

        <p class="goal" id="goal" aria-live="polite"></p>
        <p class="help">Scambia due caramelle vicine per allinearne tre o più</p>
      </div>

      <div class="board-wrap">
        <canvas
          id="board"
          tabindex="0"
          aria-label="Tabellone: frecce per muoversi, Invio per selezionare, poi una freccia per scambiare"
        ></canvas>
        <div class="combo" id="combo" aria-live="polite"></div>
      </div>
    </main>

    <div class="end" id="end" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="end-title">
        <p class="card-kicker" id="end-kicker"></p>
        <h2 id="end-title"></h2>
        <div class="stars" id="stars"></div>
        <ul class="goals" id="end-goals"></ul>
        <p id="end-score"></p>
        <div class="actions" id="end-actions"></div>
      </div>
    </div>

    <script src="../preview.js"></script>
    <script src="script.js"></script>
  </body>
</html>
