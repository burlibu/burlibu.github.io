<!doctype html><meta charset=utf-8><pre id=out></pre><script>
const VIEWPORTS = {"phone-360":[360,740],"phone-390":[390,844],"phone-land":[844,390],"tablet-768":[768,1024],"tablet-land":[1024,768],"laptop-1366":[1366,768],"desktop-1920":[1920,1080],"wide-2560":[2560,1440]};
const ROUTES = ["", "#/wind", "#/sphere", "#/baroque", "#/valhalla", "#/futuro", "#/stagger", "#/osservatorio", "#/caramelle", "#/deco", "#/kinetic", "#/contact", "#/resources", "#/graph3d", "#/graph3d/nodo/easing"];
const out = document.getElementById('out');
function check(win) { const doc = win.document;
const de = doc.documentElement, issues = [];
if (de.scrollWidth > de.clientWidth + 1) issues.push('horizontal scroll ' + de.scrollWidth + '>' + de.clientWidth);
for (const el of doc.querySelectorAll('.bento-item')) {
  const r = el.getBoundingClientRect(), name = el.textContent.trim().slice(0, 20);
  if (r.width < 80 || r.height < 60) issues.push('tile too small: ' + name + ' ' + Math.round(r.width) + 'x' + Math.round(r.height));
  if (r.right > win.innerWidth + 1 || r.left < -1) issues.push('tile off-screen: ' + name);
  const l = el.querySelector('.bento-label');
  if (l && l.getBoundingClientRect().right > r.right + 1) issues.push('label clipped: ' + name);
  if (el.scrollHeight > el.clientHeight + 1 && !el.querySelector('iframe')) issues.push('content overflow: ' + name);
}
const b = doc.querySelector('.back-link');
if (b) { const r = b.getBoundingClientRect(); if (r.right > win.innerWidth || r.top < 0) issues.push('back link off-screen'); }
const c = doc.querySelector('canvas');
if (win.location.hash === '#/graph3d' && (!c || c.getBoundingClientRect().width > win.innerWidth + 1)) issues.push('3D canvas missing or too wide');
return issues;
}
(async () => {
  for (const [vp, [w, h]] of Object.entries(VIEWPORTS)) for (const r of ROUTES) {
    const f = document.createElement('iframe');
    f.style.cssText = `width:${w}px;height:${h}px;border:0;position:absolute;left:-99999px`;
    document.body.append(f);
    await new Promise(res => { f.onload = res; f.src = '/' + r; });
    await new Promise(res => setTimeout(res, 1500));
    let issues; try { issues = check(f.contentWindow); } catch (e) { issues = ['error ' + e.message]; }
    out.textContent += (issues.length ? 'FAIL ' : 'ok   ') + vp + ' ' + (r || 'home') + ' ' + issues.join('; ') + '\n';
    f.remove();
  }
  out.textContent += 'DONE';
})();
</script>
